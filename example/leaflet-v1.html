<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Extra shapes for Leaflet</title>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../dist/leafletv1-circularshapes.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>

</head>
<body>
<div id="map"></div>

<script>
    var map = L.map('map').setView([48.398, -4.455], 13);

    var tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var d = disk([48.398, -4.454],{
        radius: 1000,
        fillOpacity: 0.4
    }).addTo(map);

    var ds = disksector([48.398, -4.454],{
        radius: 1000,
        startAngle: 0,
        stopAngle: 60,
        fillOpacity: 0.5
    }).addTo(map);

    var a = annulus([48.396, -4.481], {
        radius: 1000,
        innerRadius: 500,
        fillOpacity: 0.4
    }).addTo(map);

    var as = annulussector([48.396, -4.481], {
        radius: 1000,
        innerRadius: 500,
        startAngle: 0,
        stopAngle: 60,
        fillOpacity: 0.4
    }).addTo(map);
</script>
</body>
</html>
